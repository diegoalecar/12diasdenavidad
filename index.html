<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4b2919">
  <meta name="description" content="Completa la colección navideña de las 12 postales de Da-Gas.">
  <title>Los 12 días de Navidad | Da-Gas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <section class="game-board" aria-label="Tablero navideño">
  <section
    class="envelopes"
    id="envelopes"
    aria-label="Sobres numerados">
  </section>

  <section
    class="deck-section"
    id="deck-section"
    aria-label="Baraja de postales">

    <div class="deck" id="deck" aria-label="Baraja mezclada"></div>

    <span id="deck-count" aria-live="polite">
      12 disponibles
    </span>
  </section>
</section>

<button class="restart" id="restart" type="button">
  Mezclar de nuevo
</button>
    
    <div class="win-screen" id="win-screen" hidden>
      <div class="win-card">
        <span class="win-star">✦</span>
        <p class="eyebrow">Colección completa</p>
        <h2>¡Feliz Navidad!</h2>
        <p>Has colocado las 12 postales de Da-Gas.</p>
        <button id="play-again" type="button">Volver a jugar</button>
      </div>
    </div>
    <audio id="victory-audio" preload="auto" src="cancion-navidad.mp3"></audio>
  </main>
  <script src="game.js"></script>
</body>
</html>
