<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4b2919">
  <title>Los 12 días de Navidad | Da-Gas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <header class="intro">
      <p class="eyebrow">Una colección navideña</p>
      <h1>Los 12 días de Navidad</h1>
      <p class="instructions" id="instructions">Selecciona una postal y colócala en el sobre con el mismo número.</p>
      <div class="progress-wrap" aria-live="polite">
        <span id="progress-label">0 de 12 postales</span>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
    </header>

    <section class="envelopes" id="envelopes" aria-label="Sobres numerados">
      <!-- Los 12 sobres se generan desde game.js -->
    </section>

    <section class="deck-section" aria-label="Baraja de postales">
      <div class="deck-heading">
        <h2>Postales</h2>
        <span id="deck-count">12 disponibles</span>
      </div>
      <div class="deck" id="deck"></div>
    </section>

    <p class="feedback" id="feedback" role="status" aria-live="polite">Toca una postal para comenzar.</p>
    <button class="restart" id="restart" type="button">Mezclar de nuevo</button>
    <div class="win-screen" id="win-screen" hidden>
      <div class="win-card">
        <span class="win-star">✦</span>
        <p class="eyebrow">Colección completa</p>
        <h2>¡Feliz Navidad!</h2>
        <p>Has colocado las 12 postales de Da-Gas.</p>
        <button id="play-again" type="button">Volver a jugar</button>
      </div>
    </div>
    <audio id="victory-audio" preload="auto" src="cancion-navidad.mp3"></audio>
  </main>
  <script src="game.js"></script>
</body>
</html>
